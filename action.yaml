name: "Install the Apple certificate and provisioning profile"
description: "Implement https://docs.github.com/en/actions/use-cases-and-examples/deploying/installing-an-apple-certificate-on-macos-runners-for-xcode-development"
inputs:
  certificate_base64:
    description: "base64 encoded certificate in .p12 format"
    required: true
    default: "invalid"
  provisioning_profile_base64:
    description: "base64 encoded provisioning profile"
    required: true
    default: "invalid"
runs:
  using: "composite"
  steps:
  - name: "Install the Apple certificate and provisioning profile"
    shell: bash
    env:
      BUILD_CERTIFICATE_BASE64: ${{ inputs.certificate_base64 }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ inputs.provisioning_profile_base64 }}
    run: |
      CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
      PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
      KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

      echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
      echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

      security create-keychain -p "" $KEYCHAIN_PATH
      security set-keychain-settings $KEYCHAIN_PATH
      security unlock-keychain -p "" $KEYCHAIN_PATH

      security import $CERTIFICATE_PATH -P "" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
      security list-keychain -d user -s $KEYCHAIN_PATH

      mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
